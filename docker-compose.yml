services:
  db:
    image: postgres:16
    container_name: kikan-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: kikan
      POSTGRES_USER: kikan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est requis (voir .env.example)}
    volumes:
      - kikan_pgdata:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kikan -d kikan"]
      interval: 5s
      timeout: 5s
      retries: 12
    # Aucun port publie : la base n'est joignable que par l'API.

  api:
    build: ./backend
    container_name: kikan-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://kikan:${POSTGRES_PASSWORD}@db:5432/kikan
      KIKAN_ENV: ${KIKAN_ENV:-development}
      KIKAN_SECRET_KEY: ${KIKAN_SECRET_KEY:-}
      KIKAN_ADMIN_USER: ${KIKAN_ADMIN_USER:-admin}
      KIKAN_ADMIN_PASSWORD: ${KIKAN_ADMIN_PASSWORD:-}
      KIKAN_TOKEN_TTL_MIN: ${KIKAN_TOKEN_TTL_MIN:-240}
      KIKAN_SIGNATURE_MANUSCRITE_OBLIGATOIRE: ${KIKAN_SIGNATURE_MANUSCRITE_OBLIGATOIRE:-true}
      KIKAN_MAX_CHARTE_MB: ${KIKAN_MAX_CHARTE_MB:-10}
      # Connexion Microsoft 365 (Entra ID), facultative : activee ensuite dans Parametrage, onglet Authentification.
      KIKAN_PUBLIC_URL: ${KIKAN_PUBLIC_URL:-}
      KIKAN_SSO_TENANT_ID: ${KIKAN_SSO_TENANT_ID:-}
      KIKAN_SSO_CLIENT_ID: ${KIKAN_SSO_CLIENT_ID:-}
      KIKAN_SSO_CLIENT_SECRET: ${KIKAN_SSO_CLIENT_SECRET:-}
      KIKAN_SSO_AUTHORITY: ${KIKAN_SSO_AUTHORITY:-https://login.microsoftonline.com}
      KIKAN_SSO_CA_BUNDLE: ${KIKAN_SSO_CA_BUNDLE:-}
      KIKAN_SSO_PROXY: ${KIKAN_SSO_PROXY:-}
      # Conversion des chartes Word en PDF (service isole, sans acces Internet). Vide = desactivee.
      KIKAN_WORD_CONVERTER_URL: ${KIKAN_WORD_CONVERTER_URL:-http://converter:8090}
      KIKAN_CORS_ORIGINS: ${KIKAN_CORS_ORIGINS:-http://localhost:3000,https://localhost:3443}
      KIKAN_CERT_DIR: /certs
      KIKAN_ARCHIVE_DIR: /archive
      # Stockage des PDF scelles : local (volume), smb (lecteur reseau) ou webdav (partage web).
      KIKAN_STORAGE_BACKEND: ${KIKAN_STORAGE_BACKEND:-local}
      KIKAN_STORAGE_TIMEOUT_SEC: ${KIKAN_STORAGE_TIMEOUT_SEC:-15}
      KIKAN_STORAGE_DEADLINE_SEC: ${KIKAN_STORAGE_DEADLINE_SEC:-30}
      KIKAN_SMB_SERVER: ${KIKAN_SMB_SERVER:-}
      KIKAN_SMB_SHARE: ${KIKAN_SMB_SHARE:-}
      KIKAN_SMB_PATH: ${KIKAN_SMB_PATH:-}
      KIKAN_SMB_USER: ${KIKAN_SMB_USER:-}
      KIKAN_SMB_PASSWORD: ${KIKAN_SMB_PASSWORD:-}
      KIKAN_SMB_DOMAIN: ${KIKAN_SMB_DOMAIN:-}
      KIKAN_SMB_PORT: ${KIKAN_SMB_PORT:-445}
      KIKAN_SMB_ENCRYPT: ${KIKAN_SMB_ENCRYPT:-true}
      KIKAN_WEBDAV_URL: ${KIKAN_WEBDAV_URL:-}
      KIKAN_WEBDAV_USER: ${KIKAN_WEBDAV_USER:-}
      KIKAN_WEBDAV_PASSWORD: ${KIKAN_WEBDAV_PASSWORD:-}
      KIKAN_WEBDAV_TOKEN: ${KIKAN_WEBDAV_TOKEN:-}
      KIKAN_WEBDAV_CA_BUNDLE: ${KIKAN_WEBDAV_CA_BUNDLE:-}
      KIKAN_WEBDAV_ALLOW_HTTP: ${KIKAN_WEBDAV_ALLOW_HTTP:-false}
      # KIKAN_TSA_URL: https://freetsa.org/tsr   # optionnel : horodatage PAdES-B-T
    # Acces direct a l'API reserve a la machine locale (dev, tests).
    ports:
      - "127.0.0.1:8080:8000"
    networks:
      - default
      - convnet
    volumes:
      - kikan_certs:/certs
      - kikan_archive:/archive
      # Autorite de certification interne (PEM) pour un partage WebDAV : deposer le fichier dans ./ca
      # puis definir KIKAN_WEBDAV_CA_BUNDLE=/ca/<fichier>.pem
      - ${KIKAN_CA_DIR:-./ca}:/ca:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy

  # Conversion Word -> PDF : reseau interne uniquement (aucun acces a Internet ni a la base).
  converter:
    build: ./converter
    container_name: kikan-converter
    restart: unless-stopped
    networks:
      - convnet
    read_only: true
    tmpfs:
      - /tmp:size=512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 256

  web:
    build: ./frontend
    container_name: kikan-web
    restart: unless-stopped
    environment:
      KIKAN_HTTPS_PORT: ${KIKAN_HTTPS_PORT:-3443}
      KIKAN_TLS_SAN: ${KIKAN_TLS_SAN:-}
    # Par defaut local uniquement. Pour la tablette de signature sur le reseau local,
    # definir KIKAN_BIND=<adresse IP du serveur> dans .env.
    ports:
      - "${KIKAN_BIND:-127.0.0.1}:3000:80"
      - "${KIKAN_BIND:-127.0.0.1}:${KIKAN_HTTPS_PORT:-3443}:443"
    volumes:
      - kikan_webcerts:/etc/nginx/certs
    security_opt:
      - no-new-privileges:true
    depends_on:
      - api

networks:
  convnet:
    internal: true

volumes:
  kikan_pgdata:
  kikan_certs:
  kikan_archive:
  kikan_webcerts:
