server_tokens off;

# HTTP : simple redirection vers HTTPS (les jetons ne doivent jamais circuler en clair).
server {
    listen 80;
    server_name _;
    return 301 https://$host:${KIKAN_HTTPS_PORT}$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/kikan.crt;
    ssl_certificate_key /etc/nginx/certs/kikan.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:5m;

    root /usr/share/nginx/html;
    index index.html;

    # En-tetes de securite.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Reverse-proxy vers l'API (meme origine pour le navigateur).
    # Limite alignee sur KIKAN_MAX_IMPORT_MB (5 Mo par defaut).
    location /api/ {
        client_max_body_size 6m;
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Routage cote client (React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
