server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy vers l'API (meme origine pour le navigateur).
    location /api/ {
        proxy_pass http://api:8000/;
    }

    # Routage cote client (React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
