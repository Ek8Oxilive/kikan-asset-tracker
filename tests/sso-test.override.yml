# Kikan - SSO : configuration d'essai pour tests/sso_check.py (faux fournisseur d'identite local, instance de DEVELOPPEMENT).
#
# Usage :
#   docker compose -f docker-compose.yml -f tests/sso-test.override.yml up -d api
#   docker exec -i -e TEST_ADMIN_USER=admin -e TEST_ADMIN_PASSWORD=... kikan-api python - < tests/sso_check.py
#   docker compose up -d api      # retour a la configuration normale
#
# L'autorite http://127.0.0.1 n'est acceptee que hors production (voir app/sso.py).
services:
  api:
    environment:
      KIKAN_PUBLIC_URL: https://kikan.test
      KIKAN_SSO_TENANT_ID: 11111111-2222-3333-4444-555555555555
      KIKAN_SSO_CLIENT_ID: kikan-test-client
      KIKAN_SSO_CLIENT_SECRET: test-secret-for-mock-idp
      KIKAN_SSO_AUTHORITY: http://127.0.0.1:9910
